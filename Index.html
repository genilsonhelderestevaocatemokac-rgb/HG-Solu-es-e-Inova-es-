<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5AA8">
<meta name="description" content="HG Soluções e Inovações: sabão, pipocas, sumos, iogurtes, cursos, sites e e-books. Escolha a quantidade e peça direto no WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_AO">
<meta property="og:title" content="HG Soluções e Inovações">
<meta property="og:description" content="Solução do teu problema, inovação da tua solução. Peça direto no WhatsApp.">
<title>HG Soluções e Inovações</title>
<link rel="icon" id="fav" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Para combinar com a logo, mude só esta cor (ou use Definições > Aparência no modo de edição) */
  --azul:#1F5AA8;
  --azul-esc:#14284F;
  --ouro:#E8891C;
  --ouro-esc:#B85F00;
  --azul-cl:color-mix(in srgb,var(--azul) 9%,white);
  --azul-md:color-mix(in srgb,var(--azul) 18%,white);
  --fundo:#F5F8FE;
  --texto:#0E1A3B;
  --mudo:#586485;
  --borda:#DCE4F5;
  --wa:var(--azul);
  --r:16px;
  --sombra:0 1px 2px rgba(14,26,59,.06),0 8px 24px rgba(14,26,59,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:76px}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--texto);background:#fff;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--azul) 55%,white);outline-offset:2px;border-radius:8px}
.wrap{width:min(1120px,100% - 32px);margin-inline:auto}
h1,h2,h3{line-height:1.12;letter-spacing:-.02em}
h2{font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:800}
.sub{color:var(--mudo);max-width:60ch}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--azul);background:var(--azul);color:#fff;font-weight:700;padding:12px 20px;border-radius:12px;text-decoration:none;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{box-shadow:0 6px 18px color-mix(in srgb,var(--azul) 35%,transparent);transform:translateY(-1px)}
.btn.sec{background:#fff;color:var(--azul)}
.btn.sec:hover{background:var(--azul-cl)}
.btn.wa{background:var(--wa);border-color:var(--wa)}
.btn.claro{background:#fff;border-color:#fff;color:var(--azul-esc)}
.btn.contorno{background:transparent;border-color:rgba(255,255,255,.55);color:#fff}
.btn.pq{padding:8px 14px;font-size:.9rem;border-radius:10px}
.ico{width:18px;height:18px;flex:none}

/* barra de edição */
#admbar{display:none;background:var(--azul-esc);color:#fff;font-size:.9rem;padding:8px 0}
body.admin #admbar{display:block}
#admbar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#admbar span{margin-right:auto;font-weight:600}

/* cabeçalho */
header.topo{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--borda)}
header.topo .wrap{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.mono{width:38px;height:38px;border-radius:11px;background:var(--azul);color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:-.03em}
.logo img{height:46px;width:auto;object-fit:contain}
.lg-t{font-size:1.02rem;line-height:1.1;color:var(--azul-esc);font-weight:800;letter-spacing:-.01em}
nav.menu{display:none;margin-inline:auto;gap:4px}
nav.menu a{padding:8px 16px;border-radius:10px;text-decoration:none;font-weight:600;color:var(--mudo)}
nav.menu a:hover{background:var(--azul-cl);color:var(--azul)}
nav.menu a.ativo{color:var(--azul);background:var(--azul-cl)}
header.topo .btn{margin-left:auto}
#cta-topo{white-space:nowrap;gap:8px}
@media(max-width:560px){#cta-topo{padding:8px 10px;font-size:.82rem;gap:6px}.lg-t{font-size:.8rem;max-width:104px}.logo img{height:40px}header.topo .wrap{gap:10px}}
@media(min-width:860px){nav.menu{display:flex}header.topo .btn{margin-left:0}}

/* barra inferior (telemóvel) */
nav.abas{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--borda);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.abas a{padding:14px 4px;text-align:center;text-decoration:none;font-size:.82rem;font-weight:700;color:var(--mudo)}
nav.abas a.ativo{color:var(--azul);box-shadow:inset 0 3px 0 var(--azul)}
@media(min-width:860px){nav.abas{display:none}body{padding-bottom:0}}

.pagina{display:none}
.pagina.on{display:block}
section.bloco{padding:64px 0}
section.bloco.cinza{background:var(--fundo)}

/* herói */
.heroi{padding:48px 0 64px}
.heroi .wrap{display:grid;gap:40px;align-items:center}
.heroi h1{font-size:clamp(2.3rem,6vw,3.9rem);font-weight:800;letter-spacing:-.035em;color:var(--azul-esc)}
.heroi p.sub{margin:18px 0 26px;font-size:1.08rem}
.heroi .cta{display:flex;gap:12px;flex-wrap:wrap}
@media(min-width:900px){.heroi .wrap{grid-template-columns:1.1fr .9fr}}
.demo-fundo{background:var(--azul-md);border-radius:28px;padding:22px}
.demo{background:#fff;border-radius:20px;padding:18px;box-shadow:var(--sombra);border:1px solid var(--borda)}
.demo-top{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.demo-top .mini{width:52px;height:52px;border-radius:12px;background:var(--azul-cl);display:grid;place-items:center;font-weight:800;color:var(--azul);overflow:hidden;flex:none}
.demo-top .mini img{width:100%;height:100%;object-fit:cover}
.demo-top b{display:block;line-height:1.2}
.demo-top small{color:var(--mudo)}
.demo-nota{font-size:.82rem;color:var(--mudo);margin-bottom:8px}
.bolha{background:var(--azul-cl);border:1px solid var(--azul-md);border-radius:14px 14px 14px 4px;padding:12px 14px;margin:14px 0;font-size:.95rem;color:var(--azul-esc);position:relative}
.demo .linha{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* seletor de quantidade */
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--borda);border-radius:12px;background:#fff;overflow:hidden}
.qty button{width:38px;height:40px;border:0;background:transparent;font-size:1.25rem;font-weight:700;color:var(--azul)}
.qty button:hover{background:var(--azul-cl)}
.qty output{min-width:34px;text-align:center;font-weight:800}

/* destaques */
.trio{display:grid;gap:16px;margin-top:32px}
@media(min-width:760px){.trio{grid-template-columns:repeat(3,1fr)}}
.cartao{background:#fff;border:1px solid var(--borda);border-radius:var(--r);padding:24px;box-shadow:var(--sombra)}
.cartao h3{font-size:1.15rem;margin-bottom:8px}
.cartao p{color:var(--mudo)}
.cartao .marca{width:42px;height:42px;border-radius:12px;background:var(--azul-cl);color:var(--azul);display:grid;place-items:center;margin-bottom:14px}

/* sobre */
.sobre{display:grid;gap:32px}
@media(min-width:860px){.sobre{grid-template-columns:1.3fr .7fr;align-items:start}}
.sobre .texto p{margin-top:14px;color:var(--mudo);max-width:65ch}
.lateral{display:grid;gap:14px}
.banner{width:100%;aspect-ratio:1408/768;object-fit:cover;border-radius:22px;display:block}
.fatos{border-top:4px solid var(--ouro);background:var(--azul-esc);color:#fff;border-radius:22px;padding:26px}
.fatos dt{font-size:.85rem;color:#F3B565;margin-top:16px}
.fatos dt:first-child{margin-top:0}
.fatos dd{font-size:1.15rem;font-weight:700}

/* regras */
.regras{margin-top:28px;display:grid;gap:10px;max-width:820px}
details{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:0 18px}
details[open]{box-shadow:var(--sombra)}
summary{cursor:pointer;font-weight:700;padding:16px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--azul);font-size:1.4rem;line-height:1}
details[open] summary::after{content:"−"}
details ul{padding:0 0 16px 18px;color:var(--mudo)}
details li{margin-top:6px}
.aviso{margin-top:18px;background:var(--azul-cl);border-radius:14px;padding:16px 18px;max-width:820px;font-weight:600;color:var(--azul-esc)}

/* contactos */
.contactos{display:grid;gap:14px;margin-top:28px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.contacto .lg{width:38px;height:38px;flex:none}
.contacto .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.contacto{display:flex;flex-direction:row;align-items:center;gap:14px;text-decoration:none;background:#fff;border:1px solid var(--borda);border-radius:var(--r);padding:18px 20px;transition:border-color .15s,box-shadow .15s}
.contacto:hover{border-color:var(--azul);box-shadow:var(--sombra)}
.contacto small{color:var(--mudo)}
.contacto b{word-break:break-word}

/* bloco comunidade */
.faixa{background:var(--azul-esc);color:#fff;border-radius:28px;padding:40px 28px;display:grid;gap:22px}
.faixa h2{color:#fff}
.faixa p{color:#C6D3F7;max-width:56ch}
.faixa .cta{display:flex;gap:12px;flex-wrap:wrap}
@media(min-width:860px){.faixa{padding:52px}}

/* produtos */
.cab-pag{padding:40px 0 8px}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0}
.busca{flex:1 1 220px;min-width:180px;border:1.5px solid var(--borda);border-radius:12px;padding:11px 14px;background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;flex:1 1 100%;scrollbar-width:thin}
.chip{flex:none;border:1.5px solid var(--borda);background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;font-size:.92rem;color:var(--mudo)}
.chip.on{background:var(--azul);border-color:var(--azul);color:#fff}
.grade{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));padding-bottom:48px}
.prod{background:#fff;border:1px solid var(--borda);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sombra)}
.prod .img{aspect-ratio:4/3;background:var(--azul-cl);position:relative;display:grid;place-items:center;overflow:hidden}
.prod .img img{width:100%;height:100%;object-fit:cover}
.prod .img.vazio{background:repeating-linear-gradient(135deg,var(--azul-cl) 0 14px,color-mix(in srgb,var(--azul) 13%,white) 14px 15px)}
.ph{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--azul)}
.ph b{font-size:2.4rem;font-weight:800;line-height:1}
.ph small{font-weight:600;font-size:.8rem;opacity:.8}
body.admin .prod .img{cursor:pointer;outline:2px dashed var(--azul);outline-offset:-6px}
.troca{position:absolute;right:10px;bottom:10px;background:rgba(10,27,77,.85);color:#fff;font-size:.78rem;font-weight:600;padding:5px 10px;border-radius:8px}
.prod .corpo{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.prod .cat{font-size:.8rem;color:var(--mudo);font-weight:600}
.prod h3{font-size:1.05rem}
.prod .desc{font-size:.9rem;color:var(--mudo)}
.preco{margin-top:2px}
.preco strong{font-size:1.25rem;color:var(--azul);font-weight:800}
.preco small{color:var(--mudo);font-size:.82rem}
.total{font-size:.88rem;color:var(--ouro-esc);font-weight:700}
.total[hidden]{display:none}
.acoes{margin-top:auto;padding-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.acoes .wa{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--wa);color:#fff;border-radius:12px;height:42px;padding:0 14px;text-decoration:none;font-weight:700;min-width:110px}
.acoes .wa:hover{filter:brightness(1.06)}
.adm{display:flex;flex-wrap:wrap;gap:8px;padding-top:8px;border-top:1px dashed var(--borda);margin-top:8px}
.vazio-msg{grid-column:1/-1;text-align:center;color:var(--mudo);padding:40px 0}

/* comunidade */
.com-grade{display:grid;gap:24px;padding-bottom:56px}
@media(min-width:900px){.com-grade{grid-template-columns:.9fr 1.1fr;align-items:start}}
.form label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
.form input[type=text],.form textarea,.md input[type=text],.md input[type=number],.md input[type=password],.md input[type=email],.md textarea,.md select{width:100%;border:1.5px solid var(--borda);border-radius:12px;padding:11px 14px;background:#fff}
.form textarea,.md textarea{min-height:110px;resize:vertical}
.tipos{display:flex;gap:8px;flex-wrap:wrap}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:.9rem;color:var(--mudo)}
.feed{display:grid;gap:12px}
.post{background:#fff;border:1px solid var(--borda);border-radius:var(--r);padding:16px 18px}
.post header{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--azul-cl);color:var(--azul);display:grid;place-items:center;font-weight:800;flex:none}
.post header small{color:var(--mudo);display:block;line-height:1.2}
.tag{margin-left:auto;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--azul-cl);color:var(--azul)}
.tag.critica{background:color-mix(in srgb,var(--ouro) 16%,white);color:var(--ouro-esc)}
.tag.elogio{background:var(--azul-md);color:var(--azul-esc)}
.post p{white-space:pre-wrap;word-break:break-word}
.vazio-feed{border:2px dashed var(--borda);border-radius:var(--r);padding:32px;text-align:center;color:var(--mudo)}

/* rodapé */
footer.rodape{border-top:4px solid var(--ouro);background:var(--azul-esc);color:#C6D3F7;padding:48px 0 32px}
footer .cols{display:grid;gap:28px}
@media(min-width:760px){footer .cols{grid-template-columns:1.4fr 1fr 1.2fr}}
footer h4{color:#fff;margin-bottom:10px}
footer a{color:#C6D3F7;text-decoration:none;display:block;padding:3px 0}
footer a:hover{color:#fff}
footer .redes-rod{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
footer .redes-rod a{background:#fff;border-radius:12px;padding:5px;width:44px;height:44px;display:block}
footer .redes-rod svg{width:100%;height:100%;display:block}
footer .fim{margin-top:32px;padding-top:18px;border-top:1px solid rgba(255,255,255,.14);font-size:.85rem;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
footer .fim button{background:none;border:0;color:#C6D3F7;text-decoration:underline;font-size:.85rem}

/* redes */
.redes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.rede{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--borda);border-radius:14px;padding:10px 12px;text-decoration:none;font-weight:700;font-size:.92rem;color:var(--texto)}
.rede:hover{border-color:var(--azul);box-shadow:var(--sombra)}
.rede .lg{width:34px;height:34px;flex:none;display:block}
.rede .lg svg,.contacto .lg svg{width:100%;height:100%;display:block}

/* modais */
dialog.md{border:0;padding:0;border-radius:22px;width:min(520px,calc(100vw - 24px));box-shadow:0 24px 70px rgba(10,27,77,.35);margin:auto}
dialog.md.larga{width:min(680px,calc(100vw - 24px))}
dialog.md::backdrop{background:rgba(10,27,77,.5)}
.md-in{padding:24px;max-height:86vh;overflow:auto}
.md-in h2{font-size:1.4rem;margin-bottom:6px}
.md-in p.sub{margin-bottom:14px;font-size:.95rem}
.md-in h3{font-size:1rem;margin:22px 0 4px}
.md-in label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 5px}
.md .linha{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.md .fechar{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--azul-cl);color:var(--azul);font-size:1.3rem;line-height:1}
.flash h2{padding-right:36px}
.dois{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.md textarea.mono-txt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;min-height:130px}
.nota{font-size:.84rem;color:var(--mudo);margin-top:6px}

#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--azul-esc);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:.92rem;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:860px){#toast{bottom:32px}}

@media(max-width:560px){
 .grade{grid-template-columns:repeat(2,1fr);gap:10px}
 .prod .img{aspect-ratio:1/1}
 .prod .corpo{padding:10px;gap:4px}
 .prod h3{font-size:.92rem}
 .prod .desc{font-size:.8rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
 .preco strong{font-size:1.05rem}
 .acoes{flex-direction:column;align-items:stretch}
 .qty{display:flex;justify-content:space-between}
 .qty output{flex:1}
 .acoes .wa{min-width:0;width:100%}
 .chips{flex-wrap:wrap;overflow:visible}
 .chip{padding:6px 12px;font-size:.85rem}
}
/* carrinho */
#cartbar{position:fixed;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 24px));bottom:calc(72px + env(safe-area-inset-bottom,0px) + 10px);z-index:29}
#cartbar[hidden]{display:none}
#cartbar button{width:100%;display:flex;align-items:center;gap:12px;border:0;background:var(--azul);color:#fff;border-radius:16px;padding:12px 16px;font-weight:700;box-shadow:0 10px 30px rgba(10,27,77,.35)}
#cartbar .cb-n{min-width:28px;height:28px;border-radius:999px;background:var(--ouro);color:#fff;display:grid;place-items:center;font-size:.9rem;padding:0 8px}
#cartbar .cb-t{margin-right:auto}
body.tem-carrinho{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
body.tem-carrinho #toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
@media(min-width:860px){#cartbar{bottom:20px}body.tem-carrinho{padding-bottom:88px}body.tem-carrinho #toast{bottom:96px}}
.c-item{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--borda)}
.c-nm{flex:1 1 150px;display:flex;flex-direction:column;min-width:0}
.c-nm small{color:var(--mudo)}
.c-sub{flex-basis:100%;text-align:right;margin-top:-4px}
.c-total{display:flex;justify-content:space-between;align-items:center;padding:14px 0 4px;font-size:1.1rem}
.c-total b{color:var(--azul);font-size:1.3rem}
/* esgotado e imagem provisória */
.prod.esg .img img{filter:grayscale(.7);opacity:.6}
.esg-tag{position:absolute;left:10px;top:10px;background:var(--azul-esc);color:#fff;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:8px}
.acoes .wa.off{background:var(--borda);color:var(--mudo);pointer-events:none}
.qty button:disabled{opacity:.35;cursor:not-allowed}
.ph-logo{width:66px;height:58px;background:var(--logo-ph) center/contain no-repeat;opacity:.5}
body.admin [data-tx]{outline:1.5px dashed color-mix(in srgb,var(--azul) 55%,white);outline-offset:3px;border-radius:4px;cursor:text}
body.admin [data-tx]:focus{background:var(--azul-cl)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.heroi .demo-fundo{animation:entra .6s ease both}
</style>
</head>

function modal(html, cls = "") {
  const d = document.createElement("dialog");
  d.className = "md " + cls;
  d.innerHTML = `<div class="md-in">${html}</div>`;
  document.body.appendChild(d);
  d.addEventListener("close", () => d.remove());
  d.addEventListener("click", e => { if (e.target === d) d.close(); });
  $$("[data-fechar]", d).forEach(b => b.addEventListener("click", () => d.close()));
  d.showModal();
  return d;
}

function lerImagem(file, max = 700, tipo = "image/jpeg") {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL(tipo, .82));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
function escolherFicheiro(cb) {
  const i = document.createElement("input"); i.type = "file"; i.accept = "image/*";
  i.onchange = async () => { if (i.files[0]) { try { cb(await lerImagem(i.files[0])); } catch (e) { toast("Não foi possível ler essa imagem."); } } };
  i.click();
}

    <textarea class="mono-txt" id="d-exp" readonly>${esc(exp)}</textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn sec pq" id="d-copy">Copiar</button><button class="btn sec pq" id="d-imp">Importar backup</button><button class="btn sec pq" id="d-rep">Repor original</button></div>`, "larga");
  $("#d-logo", d).onclick = () => { const i = document.createElement("input"); i.type = "file"; i.accept = "image/*"; i.onchange = async () => { if (i.files[0]) { c.logo = await lerImagem(i.files[0], 256, "image/png"); toast("Logo carregada. Toque em Guardar."); } }; i.click(); };
  $("#d-logorm", d).onclick = () => { c.logo = ""; toast("Logo removida. Toque em Guardar."); };
  $("#d-baixar", d).onclick = descarregarSite;
  $("#d-copy", d).onclick = async () => { try { await navigator.clipboard.writeText(exp); toast("Copiado."); } catch (e) { $("#d-exp", d).select(); toast("Selecione e copie o texto."); } };
  $("#d-imp", d).onclick = () => {
    const t = prompt("Cole aqui o backup (texto exportado):"); if (!t) return;
    try { const o = JSON.parse(t); if (!o.cfg || !Array.isArray(o.produtos)) throw 0; D = o; D.cfg = Object.assign(clone(PADRAO.cfg), D.cfg); if (guardar()) { d.close(); renderTudo(); toast("Backup importado."); } } catch (e) { toast("Backup inválido."); }
  };
  $("#d-rep", d).onclick = () => { if (confirm("Repor o site original? As suas alterações neste navegador serão apagadas.")) { try { localStorage.removeItem(KEY); } catch (e) {} D = clone(PUBLICADO || PADRAO); d.close(); renderTudo(); toast("Site reposto."); } };
  $("#d-ok", d).onclick = () => {
    c.cor = $("#d-cor", d).value;
    c.whatsapp = $("#d-wa", d).value.replace(/\D/g, "") || c.whatsapp;
    c.telefone = $("#d-tel", d).value.trim(); c.email = $("#d-mail", d).value.trim();
    ["grupo", "facebook", "instagram", "tiktok", "tiktoklite"].forEach(k => L[k] = $("#d-" + k, d).value.trim());
    c.nome = $("#d-nome", d).value.trim() || c.nome;
    c.lema = $("#d-lema", d).value.trim() || c.lema; c.fundacao = $("#d-fund", d).value.trim();
    c.historia = $("#d-hist", d).value.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
    const rg = textoParaRegras($("#d-regras", d).value); if (rg.length) D.regras = rg;
    c.pin = $("#d-pin", d).value.trim() || c.pin;
    if (guardar()) { d.close(); renderTudo(); toast("Definições guardadas."); }
  };
}

function descarregarSite() {
  const cl = document.documentElement.cloneNode(true);
  ["p-inicio", "p-produtos", "p-comunidade", "rodape", "logo"].forEach(id => { const e = cl.querySelector("#" + id); if (e) e.innerHTML = ""; });
  cl.querySelectorAll("dialog").forEach(x => x.remove());
  cl.querySelectorAll(".on,.ativo").forEach(x => x.classList.remove("on", "ativo"));
  cl.querySelector("body").className = "";
  cl.removeAttribute("style");
  const t = cl.querySelector("#toast"); t.className = ""; t.textContent = "";
  cl.querySelector("#cartbar").hidden = true;
  const sc = cl.querySelector("#app");
  const dados = JSON.stringify({cfg: D.cfg, produtos: D.produtos, regras: D.regras || null}).replace(/</g, "\\u003c");
  sc.textContent = sc.textContent.replace(/\/\*PUB_INI\*\/[\s\S]*?\/\*PUB_FIM\*\//, () => "/*PUB_INI*/const PUBLICADO = " + dados + ";/*PUB_FIM*/");
  const blob = new Blob(["<!DOCTYPE html>\n" + cl.outerHTML], {type: "text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "index.html";
  document.body.appendChild(a); a.click(); a.remove();
  toast("Ficheiro index.html descarregado. Publique-o no lugar do antigo.");
}

/* =====================================================================
   Pedido com vários produtos (carrinho)
   ===================================================================== */
let dlgCarrinho = null;
const itensCarrinho = () => D.produtos.filter(p => (qty[p.id] || 0) > 0 && !p.esgotado).map(p => ({p, q: qty[p.id]}));
const nItens = () => itensCarrinho().reduce((t, x) => t + x.q, 0);
const totalCarrinho = () => itensCarrinho().reduce((t, x) => t + x.p.valor * x.q, 0);
function lerCliente() { try { return JSON.parse(localStorage.getItem(KEYCL) || "{}") || {}; } catch (e) { return {}; } }
function guardarCliente(o) { try { localStorage.setItem(KEYCL, JSON.stringify(o)); } catch (e) {} }

function msgCarrinho(cli) {
  const l = itensCarrinho().map(({p, q}) => `• ${q} × ${p.nome} — ${fmt(p.valor * q)}`).join("\n");
  let m = `Olá, ${D.cfg.nome}! Quero fazer este pedido:\n\n${l}\n\nTotal: ${fmt(totalCarrinho())}\n`;
  if (cli.nome) m += `\nNome: ${cli.nome}`;
  m += `\nEndereço de entrega: ${cli.end || "(vou indicar)"}`;
  if (cli.tel) m += `\nContacto: ${cli.tel}`;
  return m;
}

function atualizarCarrinho() {
  const n = nItens(), b = $("#cartbar"); if (!b) return;
  const vis = n > 0 && rotaAtual === "produtos";
  b.hidden = !vis;
  document.body.classList.toggle("tem-carrinho", vis);
  if (n > 0) { $("#cb-n").textContent = n; $("#cb-v").textContent = fmt(totalCarrinho()); }
}

function desenharCarrinho() {
  const d = dlgCarrinho; if (!d) return;
  if (!nItens()) { d.close(); return; }
  $("#c-lista", d).innerHTML = itensCarrinho().map(({p, q}) => `<div class="c-item">
    <div class="c-nm"><b>${esc(p.nome)}</b><small>${fmt(p.valor)} cada</small></div>
    <div class="qty" role="group" aria-label="Quantidade de ${esc(p.nome)}"><button data-a="cmenos" data-id="${p.id}" aria-label="Diminuir">−</button><output>${q}</output><button data-a="cmais" data-id="${p.id}" aria-label="Aumentar">+</button></div>
    <b class="c-sub">${fmt(p.valor * q)}</b></div>`).join("");
  $("#c-total", d).textContent = fmt(totalCarrinho());
  $("#c-enviar", d).href = waLink(msgCarrinho(lerCliente()));
}

function abrirCarrinho() {
  if (!nItens()) return;
  const cli = lerCliente();
  const d = modal(`<button class="fechar" data-fechar aria-label="Fechar">×</button>
    <h2 style="padding-right:36px">O seu pedido</h2>
    <p class="sub">Confirme os produtos e envie tudo numa só mensagem.</p>
    <div id="c-lista"></div>
    <div class="c-total"><span>Total</span><b id="c-total"></b></div>
    <label for="c-nome">Nome (opcional)</label><input id="c-nome" type="text" autocomplete="name" value="${esc(cli.nome || "")}">
    <label for="c-end">Endereço de entrega</label><input id="c-end" type="text" autocomplete="street-address" value="${esc(cli.end || "")}">
    <label for="c-tel">Contacto (opcional)</label><input id="c-tel" type="text" inputmode="tel" autocomplete="tel" value="${esc(cli.tel || "")}">
    <p class="nota">A encomenda só é processada depois de confirmarmos produtos, quantidades, endereço e contacto. Iogurtes, mousses e gelados em grande quantidade: peça com 24 horas de antecedência.</p>
    <div class="linha"><button class="btn sec" data-a="climpar">Limpar pedido</button><a class="btn wa" id="c-enviar" target="_blank" rel="noopener">${WA_SVG} Enviar pedido no WhatsApp</a></div>`);
  dlgCarrinho = d;
  d.addEventListener("close", () => { dlgCarrinho = null; });
  const guardar2 = () => {
    guardarCliente({nome: $("#c-nome", d).value.trim(), end: $("#c-end", d).value.trim(), tel: $("#c-tel", d).value.trim()});
    $("#c-enviar", d).href = waLink(msgCarrinho(lerCliente()));
  };
  ["c-nome", "c-end", "c-tel"].forEach(i => $("#" + i, d).addEventListener("input", guardar2));
  desenharCarrinho();
}

/* =====================================================================
   Eventos
   ===================================================================== */
document.addEventListener("click", e => {
  const ir2 = e.target.closest("[data-ir]");
  if (ir2) { setTimeout(() => { const el = document.getElementById(ir2.dataset.ir); if (el) el.scrollIntoView(); }, 60); }
  const t = e.target.closest("[data-a]"); if (!t) return;
  const a = t.dataset.a, id = t.dataset.id;
  const p = id && D.produtos.find(x => x.id === id);
  switch (a) {
    case "mais": if (p && p.esgotado) break; qty[id] = Math.min(99, (qty[id] || 0) + 1); guardarQty(); atualizarCard(id); atualizarCarrinho(); break;
    case "menos": qty[id] = Math.max(0, (qty[id] || 0) - 1); guardarQty(); atualizarCard(id); atualizarCarrinho(); break;
    case "carrinho": abrirCarrinho(); break;
    case "cmais": qty[id] = Math.min(99, (qty[id] || 0) + 1); guardarQty(); atualizarCard(id); atualizarCarrinho(); desenharCarrinho(); break;
    case "cmenos": qty[id] = Math.max(0, (qty[id] || 0) - 1); guardarQty(); atualizarCard(id); atualizarCarrinho(); desenharCarrinho(); break;
    case "climpar": Object.keys(qty).forEach(k => delete qty[k]); guardarQty(); $$(".prod").forEach(el => atualizarCard(el.dataset.pid)); atualizarCarrinho(); if (dlgCarrinho) dlgCarrinho.close(); toast("Pedido limpo."); break;
    case "dmais": demoQ = Math.min(99, demoQ + 1); atualizarDemo(); break;
    case "dmenos": demoQ = Math.max(0, demoQ - 1); atualizarDemo(); break;
    case "cat": filtroCat = t.dataset.v; $$("#chips .chip").forEach(c => c.classList.toggle("on", c === t)); $("#grade").innerHTML = listaProdutos(); break;
    case "tipo": tipoPost = t.dataset.v; $$("#tipos .chip").forEach(c => c.classList.toggle("on", c === t)); break;
    case "publicar": {
      const msg = $("#pmsg").value.trim(), nome = $("#pnome").value.trim() || "Anónimo";
      if (msg.length < 5) { toast("Escreva uma mensagem com pelo menos 5 letras."); break; }
      const ps = lerPosts(); ps.unshift({id: "c" + Date.now(), nome, tipo: tipoPost, msg, data: new Date().toISOString()});
      guardarPosts(ps.slice(0, 200));
      if ($("#pwa").checked) window.open(waLink(`Olá, ${D.cfg.nome}! Deixo a minha ${tipoPost.toLowerCase()} na comunidade:\n${msg}\n— ${nome}`), "_blank", "noopener");
      $("#pmsg").value = ""; renderPosts(); toast("Publicado. Obrigado pela sua opinião!"); break;
    }
    case "delpost": if (confirm("Apagar esta publicação?")) { guardarPosts(lerPosts().filter(x => x.id !== id)); renderPosts(); } break;
    case "entrar": entrarAdmin(); break;
    case "sair": sairAdmin(); break;
    case "novo": ir_produtos(); editarProduto(null); break;
    case "defs": definicoes(); break;
    case "baixar": descarregarSite(); break;
    case "editar": editarProduto(id); break;
    case "apagar": if (p && confirm(`Remover "${p.nome}"?`)) { D.produtos = D.produtos.filter(x => x.id !== id); if (guardar()) { if (!cats().includes(filtroCat)) filtroCat = "Todos"; renderTudo(); toast("Produto removido."); } } break;
    case "img": if (admin && p) escolherFicheiro(u => { p.img = u; if (guardar()) { renderTudo(); toast("Imagem guardada."); } }); break;
  }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[data-a="img"]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("focusout", e => {
  const el = e.target.closest && e.target.closest("[data-tx]"); if (!el || !admin) return;
  const v = el.innerText.trim(), k = el.dataset.tx;
  if (k === "lema") D.cfg.lema = v || D.cfg.lema; else D.cfg.textos[k] = v;
  guardar();
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.closest && e.target.closest("[data-tx]")) { e.preventDefault(); e.target.blur(); }
});
document.addEventListener("paste", e => {
  if (e.target.closest && e.target.closest("[data-tx]")) { e.preventDefault(); document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text")); }
});
function ir_produtos() { if (rotaAtual !== "produtos") location.hash = "#/produtos"; }

/* Início */
renderTudo();
ir();
try {
  if (!sessionStorage.getItem("hg_flash")) { sessionStorage.setItem("hg_flash", "1"); setTimeout(mostrarFlash, 900); }
} catch (e) { setTimeout(mostrarFlash, 900); }
</script>
</body>
</html>
